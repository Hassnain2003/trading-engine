# pre-commit configuration for trading-engine.
# Runs gitleaks, ruff, and a secrets/artifacts block on every commit.
# Install:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--select=E9,F63,F7,F82]
      - id: ruff-format

  - repo: local
    hooks:
      - id: block-secrets-and-artifacts
        name: Block committing secrets and runtime artifacts
        entry: scripts/block_commit_artifacts.py
        language: python
        files: \.(py|md|yaml|yml|toml|cfg|cfg|example|sh)$
        stages: [commit]
        pass_filenames: true
